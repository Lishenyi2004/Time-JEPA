# Matched Time-JEPA + longitudinal law; decoded video PTS. Full 20-epoch run.
app: vjepa_2_1_law
nodes: 1
tasks_per_node: 1
cpus_per_task: 8
mem_per_gpu: 80G
folder: outputs/weather_ood/covla_time_jepa_law_video_pts_v2_alpha0p5_seed239_e20
data:
  dataset_type: CoVLAVideoDataset
  datasets:
  - data/CoVLA-Dataset
  datasets_weights: null
  encoder_train_split: time-jepa/splits/covla_weather_ood/covla_encoder_train.json
  require_encoder_train_split: true
  expected_encoder_train_videos: 6305
  batch_size: 8
  crop_size: 384
  patch_size: 16
  dataset_fpcs:
  - 64
  tubelet_size: 2
  fps: 5
  strict_time_sampling: true
  num_workers: 2
  persistent_workers: true
  pin_mem: false
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0
loss:
  loss_exp: 1.0
  predict_all: true
  reg_coeff: 0.0
  shift_by_n: 0
  weight_distance_loss: true
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 8
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 2
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: true
  read_checkpoint: vjepa2_1_vitg_384.pt
  save_every_freq: 1
  seed: 239
  tensorboard: true
  tqdm: true
  use_sdpa: true
model:
  has_cls_first: false
  img_temporal_dim_size: null
  interpolate_rope: true
  is_causal: false
  lambda_value_img: 0.0
  lambda_value_vid: 0.5
  local_window:
  - -1
  - -1
  - -1
  modality_embedding: true
  model_name: vit_giant_xformers
  n_registers: 0
  n_registers_predictor: 0
  normalize_predictor: false
  pred_depth: 24
  pred_embed_dim: 384
  pred_is_causal: false
  pred_local_window:
  - -1
  - -1
  - -1
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  vit_conv: false
  zero_init_mask_tokens: true
optimization:
  ema:
  - 0.9995
  - 0.9999
  epochs: 20
  final_lr: 1.0e-06
  final_weight_decay: 0.01
  ipe: null
  ipe_scale: 1.0
  lr: 3.0e-05
  start_lr: 3.0e-06
  warmup: 1
  weight_decay: 0.01
time_jepa:
  enabled: true
  targets:
  - vEgo
  - aEgo
  - yaw_rate
  head_type: conv1x1
  feature_mode: final
  lambda_phys: 0.2
  lambda_phys_warmup_steps: 250
  smooth_l1_beta: 0.5
  disable_horizontal_flip: true
  stats_cache: time-jepa/cache/covla_weather_ood_encoder_train_6305_64f5fps_strict_vEgo_aEgo_yaw_rate_stats.json
  stats_max_videos: 2000
  stats_seed: 239
explicit_physics_law:
  protocol: covla_longitudinal_trapezoid_video_pts_v2
  alpha: 0.5
  smooth_l1_beta: 0.5
  gate_path: time-jepa/cache/covla_law_train6305_gate_video_pts_v2.json
  health_check_steps: 10
  smoke_max_steps: 0
  expected_world_size: 8
