# Small integration check, excluded from the formal paper experiment index.
# Supply the dataset and compatible V-JEPA 2.1 encoder checkpoint separately.
dataset: covla
covla_root: data/CoVLA-Dataset
ood: none
arch: vitg_384
encoder_family: vjepa2_1
checkpoint_key: auto
encoder_checkpoint: outputs/weather_ood/covla_vitg384_64f5fps_strict_time_jepa_conv1x1_final_split6305_lr3e-5_e20/last.pth.tar
output_dir: outputs/quickstart/covla_probe_smoke
target_mode: state
targets: [vEgo, aEgo, yaw_rate]
probe_type: conv1x1
probe_depth: 1
probe_hidden_dim: 0
tubelet_size: 2
epochs: 1
batch_size: 1
num_workers: 0
lr: 1.0e-4
start_lr: null
final_lr: 1.0e-6
warmup_epochs: 0.0
lr_schedule: cosine
weight_decay: 0.01
final_weight_decay: null
train_ratio: 0.8
val_ratio: 0.1
split_dir: time-jepa/splits/covla_weather_ood
train_split: probe_train
val_split: probe_val
test_split: test
covla_ood_test_split: weather_ood_test
max_train_videos: 2
max_val_videos: 1
max_test_videos: 1
frame_span: null
frame_stride: 4
video_num_threads: 1
keep_state_cache: false
seed: 239
device: cuda
use_bfloat16: true
tensorboard_dir: null
no_tensorboard: true
