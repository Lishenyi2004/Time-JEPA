dataset: egoexo
ood: none
egoexo_root: data/EgoExo4D_minimal
# Main ID=test(view01); view02/04 are reported separately and macro-averaged with view01.
egoexo_video_view: view01
egoexo_train_video_keys:
- view01
- view02
- view04
egoexo_seen_video_keys:
- view02
- view04
egoexo_ood_video_keys:
- view03
egoexo_split_dir: time-jepa/splits
egoexo_split_prefix: egoexo_exo124_view3ood
egoexo_manifest_path: time-jepa/splits/egoexo_exo124_view3ood_split_manifest.json
egoexo_fps: 5.0
egoexo_slice_stride_seconds: 12.8
egoexo_max_time_delta: 0.05
egoexo_pose_fps: 30.0
egoexo_min_views: 2
egoexo_smooth_window: 5
egoexo_video_backend: auto
egoexo_ffmpeg_timeout: 120
egoexo_stats_cache: time-jepa/cache/egoexo_exo124_view3ood_whole_body_compact_v2_64f5fps_stats.json
arch: vitg_384
encoder_family: vjepa2_1
checkpoint_key: auto
target_mode: state
targets:
- whole_body_compact_v2
probe_type: conv1x1
probe_depth: 1
probe_hidden_dim: 0
tubelet_size: 2
epochs: 15
batch_size: 8
num_workers: 2
lr: 0.0001
start_lr: null
final_lr: 1.0e-06
warmup_epochs: 1
lr_schedule: cosine
weight_decay: 0.01
final_weight_decay: null
train_split: probe_train
val_split: probe_val
test_split: test
max_train_videos: 0
max_val_videos: 0
max_test_videos: 0
frame_span: 128
frame_stride: 0
video_num_threads: 1
keep_state_cache: false
seed: 239
device: cuda
use_bfloat16: false
tensorboard_dir: null
no_tensorboard: false
# Sensor-robustness encoder: training targets shifted by 0.8 s, probe labels stay clean.
# Protocol is identical to the clean exo124_view3ood Time-JEPA readout probe.
encoder_checkpoint: outputs/egoexo_sensor_robustness/exo124_view3ood/time_offset_0p8s/encoder_seed239_lr3e-5_e20/last.pth.tar
output_dir: time-jepa/outputs_sensor_robustness/egoexo/exo124_view3ood/time_offset_0p8s/whole/readout/time/egoexo_conv
