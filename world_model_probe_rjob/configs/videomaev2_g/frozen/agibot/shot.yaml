# Same AgiBot whole-body-v2 three-view shot protocol; only the encoder changes.
base_config: covla_probe_rjob/configs/agibot_wholebody_v2/shot/zero/agibot_shot_probe_3view_conv.yaml

train:
  agibot_shot_ood_protocol: same_side
  arch: videomaev2_g
  encoder_family: videomaev2
  checkpoint_key: model
  encoder_checkpoint: VideoMAEv2/checkpoints/mae-g/vit_g_hybrid_pt_1200e.pth
  encoder_dtype: float16
  attention_implementation: sdpa
  videomae_temporal_mode: full
  encoder_microbatch_size: 1
  output_dir: time-jepa/outputs_world_model/videomaev2_g/frozen/agibot_wholebody_v2/shot/probe_3view/conv1x1
